  <style>
    /* Match the Flutter light theme background (the default) so the first
       paint doesn't flash. Visitors who chose dark get the navy shell instead
       via the inline script below, before the splash is ever painted. */
    html, body { background: #f9f7f7; margin: 0; padding: 0; }
    html[data-theme="dark"], html[data-theme="dark"] body { background: #0e2233; }
    /* Minimal boot splash: monogram + pulsing rule. Removed by the app once
       the first Flutter frame is on screen (see lib/app/boot.dart). */
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: #f9f7f7; color: #112d4e; z-index: 9999;
      font: 600 13px/1 ui-monospace, "JetBrains Mono", Menlo, monospace;
      letter-spacing: 0.24em; transition: opacity .35s ease-out;
    }
    #splash.hide { opacity: 0; pointer-events: none; }
    html[data-theme="dark"] #splash { background: #0e2233; color: #eaf6f9; }
    #splash .rule { width: 56px; height: 1px; background: #3f72af; opacity: .9;
      animation: splash-pulse 1.4s ease-in-out infinite; }
    html[data-theme="dark"] #splash .rule { background: #2bd9c4; }
    @keyframes splash-pulse { 0%,100% { transform: scaleX(.3); opacity: .35 } 50% { transform: scaleX(1); opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { #splash .rule { animation: none } }
  </style>
</head>
<body>
  <!-- Returning visitors who chose dark: paint the navy shell before the
       splash renders. Reads the same `cv_theme` key the Flutter app persists
       through shared_preferences (stored as `flutter.cv_theme`). -->
  <script>
    try {
      var t = localStorage.getItem('flutter.cv_theme');
      if (t && t.replace(/"/g, '') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    } catch (e) {}
  </script>
  <div id="splash" aria-hidden="true"><span>MK</span><div class="rule"></div></div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
